# PostgreSQL. This app runs on Postgres in every environment. The URL is set
# explicitly per environment so that DATABASE_URL (which Rails otherwise uses
# for the primary connection in ALL environments) cannot point `test` at the
# development database.
default: &default
  adapter: postgresql
  timeout: 5000

development:
  primary:
    <<: *default
    url: <%= ENV.fetch("DEV_DATABASE_URL", "postgres://coder:coder@localhost:5432/metroid_mania_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from the schema when you run "bin/rails test".
# It is intentionally a separate database from development.
test:
  primary:
    <<: *default
    url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres://coder:coder@localhost:5432/metroid_mania_test") %>

production:
  primary:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    adapter: postgresql
    url: <%= ENV["DATABASE_CACHE_URL"] || ENV["DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    adapter: postgresql
    url: <%= ENV["DATABASE_QUEUE_URL"] || ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    adapter: postgresql
    url: <%= ENV["DATABASE_CABLE_URL"] || ENV["DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
